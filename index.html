<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6E9CC;
    --paper-card:#FFFBF2;
    --ink:#33200F;
    --ink-soft:#6B563F;
    --lacquer:#92092D;
    --magenta:#A8442A;
    --gold:#D8A32B;
    --gold-pale:#F0DCA6;
    --indigo:#22405C;
    --u:1vh;   /* หน่วยตามด้านสูงของเวที */
    --w:1vw;   /* หน่วยตามด้านกว้างของเวที */
  }
  body.rot90, body.rot270{--u:1vw;--w:1vh}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- กรอบเวที ปกติเต็มจอ ถ้าสั่งหมุนจะสลับด้านกว้างยาว ---------- */
  #stage{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 50% 30%, rgba(216,163,43,.22), transparent 58%),
      radial-gradient(circle at 85% 95%, rgba(146,9,45,.07), transparent 45%);
    overflow:hidden;
  }
  body.rot90 #stage,
  body.rot270 #stage{
    position:absolute;width:100vh;height:100vw;transform-origin:0 0;
  }
  body.rot90 #stage{top:0;left:100%;transform:rotate(90deg)}
  body.rot270 #stage{top:100%;left:0;transform:rotate(-90deg)}

  /* ---------- หัวจอ ---------- */
  .fringe{display:block;width:100%;height:calc(2.2 * var(--u));min-height:16px;flex:none}
  .banner{flex:none;text-align:center;padding:calc(1.6 * var(--u)) calc(3 * var(--w)) 0}
  .banner h1{
    font-family:'Kanit',sans-serif;font-weight:600;
    font-size:clamp(24px,calc(2.6 * var(--u)),46px);
    color:var(--lacquer);margin:calc(0.6 * var(--u)) 0 0;line-height:1.3;
  }
  .banner p{margin:calc(0.3 * var(--u)) 0 0;color:var(--ink-soft);font-size:clamp(15px,calc(1.4 * var(--u)),24px)}

  /* ---------- มาสคอต ---------- */
  .hero{flex:none;position:relative;display:flex;justify-content:center;padding-top:calc(1 * var(--u))}
  .backdrop{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;width:auto;aspect-ratio:1/1;z-index:0}
  .mascot-figure{
    position:relative;z-index:1;height:calc(33 * var(--u));width:auto;max-width:calc(84 * var(--w));
    filter:drop-shadow(0 calc(2 * var(--u)) calc(2.4 * var(--u)) rgba(51,32,15,.24));
    animation:enter .8s ease-out both;
  }
  .thinking .mascot-figure{animation:bob 1.6s ease-in-out infinite}
  @keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-calc(1.4 * var(--u)))}}

  .nameplate{
    flex:none;text-align:center;margin:calc(0.4 * var(--u)) 0 0;
    font-family:'Kanit',sans-serif;font-weight:500;color:var(--lacquer);
    font-size:clamp(18px,calc(2 * var(--u)),34px);
  }

  /* ---------- แผงสนทนา ---------- */
  .panel{
    flex:1;min-height:0;display:flex;flex-direction:column;
    margin:calc(1.4 * var(--u)) calc(4 * var(--w)) calc(2.4 * var(--u));
    background:var(--paper-card);
    border:1px solid rgba(146,9,45,.22);
    border-top:calc(0.6 * var(--u)) solid var(--lacquer);
    border-radius:calc(2 * var(--u));
    padding:calc(2 * var(--u)) calc(3 * var(--w)) calc(1.8 * var(--u));
  }
  .log{flex:1;min-height:0;overflow-y:auto;padding-right:calc(1 * var(--w));scroll-behavior:smooth;font-size:clamp(17px,calc(1.75 * var(--u)),30px);line-height:1.75}
  .log::-webkit-scrollbar{width:10px}
  .log::-webkit-scrollbar-thumb{background:var(--gold-pale);border-radius:8px}

  .msg{margin-bottom:calc(1.6 * var(--u));max-width:60ch}
  .msg.me{margin-left:auto;background:var(--indigo);color:#fff;padding:calc(1 * var(--u)) calc(2 * var(--w));border-radius:calc(2 * var(--u)) calc(2 * var(--u)) calc(0.5 * var(--u)) calc(2 * var(--u));width:fit-content}
  .msg.bot{border-left:calc(0.5 * var(--u)) solid var(--gold);padding-left:calc(1.6 * var(--w))}
  .msg.err{border-left:calc(0.5 * var(--u)) solid var(--magenta);padding-left:calc(1.6 * var(--w));color:var(--lacquer)}
  .msg p{margin:0 0 calc(0.8 * var(--u))}
  .msg ul{margin:calc(0.6 * var(--u)) 0 calc(0.8 * var(--u));padding-left:1.6em}
  .msg li{margin-bottom:calc(0.4 * var(--u))}
  .msg li::marker{color:var(--gold)}
  .msg strong{color:var(--lacquer)}
  .msg em{font-style:normal;color:var(--magenta)}
  .msg.me strong{color:var(--gold-pale)}
  .speak{
    background:none;border:0;padding:0;cursor:pointer;
    font-family:'Sarabun',sans-serif;font-size:.8em;color:var(--ink-soft);
    border-bottom:1px dotted var(--ink-soft);
  }

  .dots{display:inline-flex;gap:calc(0.6 * var(--u));vertical-align:middle}
  .dots i{width:calc(1.1 * var(--u));height:calc(1.1 * var(--u));min-width:8px;min-height:8px;border-radius:50%;background:var(--magenta);animation:pulse 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  .chips{flex:none;display:flex;gap:calc(1 * var(--u));flex-wrap:wrap;justify-content:center;margin:calc(1.4 * var(--u)) 0 calc(1.2 * var(--u));padding-top:calc(1.4 * var(--u));border-top:1px solid var(--gold-pale)}
  .chip{
    font-family:'Sarabun',sans-serif;font-size:clamp(15px,calc(1.6 * var(--u)),26px);
    background:transparent;border:1px solid var(--gold);color:var(--ink);
    border-radius:999px;padding:calc(0.9 * var(--u)) calc(2 * var(--w));cursor:pointer;
  }
  .chip:active{background:var(--gold-pale)}

  .composer{flex:none;display:flex;gap:calc(1.2 * var(--w));align-items:center}
  textarea{
    flex:1;resize:none;font-family:'Sarabun',sans-serif;
    font-size:clamp(17px,calc(1.9 * var(--u)),30px);line-height:1.5;
    padding:calc(1.4 * var(--u)) calc(2.4 * var(--w));border:1px solid rgba(51,32,15,.28);border-radius:999px;
    background:#fff;color:var(--ink);height:auto;overflow:hidden;
  }
  textarea:focus{outline:calc(0.4 * var(--u)) solid var(--gold);outline-offset:2px;border-color:var(--gold)}
  .btn{
    font-family:'Kanit',sans-serif;font-weight:500;font-size:clamp(17px,calc(1.9 * var(--u)),30px);
    background:var(--lacquer);color:#FFF6E2;border:0;border-radius:999px;
    padding:calc(1.4 * var(--u)) calc(3.4 * var(--w));cursor:pointer;white-space:nowrap;
  }
  .btn:disabled{opacity:.5}
  .icon-btn{
    background:#fff;border:1px solid rgba(51,32,15,.28);border-radius:50%;
    width:calc(6.4 * var(--u));height:calc(6.4 * var(--u));min-width:46px;min-height:46px;cursor:pointer;line-height:0;flex:none;
  }
  .icon-btn[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta)}
  .icon-btn[aria-pressed="true"] svg{fill:#fff}
  .icon-btn svg{width:50%;height:50%;fill:var(--ink)}

  /* ปุ่มพูดคำถาม */
  .mic-btn{
    display:inline-flex;align-items:center;gap:calc(1 * var(--w));flex:none;
    font-family:'Kanit',sans-serif;font-weight:500;font-size:clamp(17px,calc(1.9 * var(--u)),30px);
    background:#fff;border:1px solid var(--gold);color:var(--ink);
    border-radius:999px;padding:calc(1.4 * var(--u)) calc(2.6 * var(--w));cursor:pointer;white-space:nowrap;
  }
  .mic-btn svg{width:1.2em;height:1.2em;fill:var(--lacquer)}
  .mic-btn:disabled{opacity:.45}
  .mic-btn.listening{background:var(--lacquer);border-color:var(--lacquer);color:#FFF6E2;animation:listen 1.2s ease-in-out infinite}
  .mic-btn.listening svg{fill:#FFF6E2}
  @keyframes listen{0%,100%{box-shadow:0 0 0 0 rgba(146,9,45,.35)}50%{box-shadow:0 0 0 calc(1.4 * var(--u)) rgba(146,9,45,0)}}
  .voice-hint{flex:none;margin:calc(1 * var(--u)) 0 0;font-size:clamp(14px,calc(1.5 * var(--u)),24px);color:var(--lacquer);background:rgba(216,163,43,.14);border-radius:calc(1 * var(--u));padding:calc(0.8 * var(--u)) calc(1.6 * var(--w))}
  .banner, #mascotPanel{max-width:960px;margin-left:auto;margin-right:auto;width:100%}
  .panel{max-width:960px;margin-left:auto;margin-right:auto;width:calc(100% - calc(8 * var(--w)))}
  :focus-visible{outline:calc(0.4 * var(--u)) solid var(--lacquer);outline-offset:2px}

  .foot{flex:none;margin-top:calc(1 * var(--u));font-size:clamp(12px,calc(1.3 * var(--u)),20px);color:var(--ink-soft);display:flex;justify-content:space-between;gap:calc(2 * var(--w))}
  .linkish{background:none;border:0;padding:0;font:inherit;color:var(--ink-soft);cursor:pointer;text-decoration:underline}

  /* ปุ่มเต็มจอ มุมขวาบน จางไว้ไม่ให้แย่งความสนใจ */
  #full{
    position:absolute;top:calc(2.4 * var(--u));right:calc(1.6 * var(--w));z-index:5;
    background:rgba(255,255,255,.7);border:1px solid var(--gold);border-radius:50%;
    width:calc(5 * var(--u));height:calc(5 * var(--u));min-width:38px;min-height:38px;cursor:pointer;line-height:0;opacity:.55;
  }
  #full:hover{opacity:1}
  #full svg{width:50%;height:50%;fill:var(--lacquer)}

  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div id="stage">

  <svg class="fringe" aria-hidden="true">
    <defs>
      <pattern id="tung" width="26" height="24" patternUnits="userSpaceOnUse">
        <rect width="26" height="5" fill="#D8A32B"></rect>
        <path d="M0 5 H26 L13 21 Z" fill="#92092D"></path>
        <circle cx="13" cy="2.5" r="1.4" fill="#FFFBF2"></circle>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#tung)"></rect>
  </svg>

  <button id="full" type="button" title="เต็มจอ" aria-label="สลับโหมดเต็มจอ">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"></path></svg>
  </button>

  <header class="banner">
    <h1>ถามเรื่องล้านนากับน้องจ๊างน้อย</h1>
    <p>เมืองเหนือ ประเพณี อาหาร ภาษาคำเมือง หรือสถานที่สำคัญ</p>
  </header>

  <div id="mascotPanel">
    <div class="hero">
      <svg class="backdrop" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <radialGradient id="moon" cx="50%" cy="48%" r="50%">
            <stop offset="58%" stop-color="#F3E0A6" stop-opacity=".62"></stop>
            <stop offset="100%" stop-color="#F3E0A6" stop-opacity="0"></stop>
          </radialGradient>
        </defs>
        <circle cx="200" cy="196" r="190" fill="url(#moon)"></circle>
        <circle cx="200" cy="196" r="156" fill="none" stroke="#D8A32B" stroke-width="1.4" opacity=".5"></circle>
        <g opacity=".92">
          <line x1="356" y1="0" x2="356" y2="56" stroke="#92092D" stroke-width="1.4"></line>
          <rect x="344" y="56" width="24" height="5" fill="#D8A32B"></rect>
          <path d="M344 61 C332 76 332 98 344 112 H368 C380 98 380 76 368 61 Z" fill="#92092D"></path>
          <line x1="335" y1="86" x2="377" y2="86" stroke="#D8A32B" stroke-width="1.6"></line>
          <g stroke="#D8A32B" stroke-width="1.4">
            <line x1="348" y1="112" x2="348" y2="122"></line>
            <line x1="356" y1="112" x2="356" y2="125"></line>
            <line x1="364" y1="112" x2="364" y2="122"></line>
          </g>
        </g>
      </svg>
      <img id="mascot" class="mascot-figure" alt="น้องจ๊างน้อย ช้างน้อยในชุดพื้นเมืองล้านนา โพกผ้าและพาดผ้าขาวม้า">
    </div>
    <p class="nameplate">น้องจ๊างน้อย</p>
  </div>

  <section class="panel">
    <div class="log" id="log" role="log" aria-live="polite" aria-label="บทสนทนากับน้องจ๊างน้อย"></div>

    <div class="chips" id="chips"></div>

    <div class="composer">
      <label for="q" style="position:absolute;left:-9999px">พิมพ์คำถาม</label>
      <textarea id="q" rows="1" maxlength="300" placeholder="พิมพ์คำถาม"></textarea>
      <button class="mic-btn" id="mic" type="button" aria-pressed="false" title="พูดคำถาม">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"></path></svg>
        <span id="micLabel">แตะแล้วพูด</span>
      </button>
      <button class="btn" id="send" type="button">ถาม</button>
    </div>

    <p class="voice-hint" id="voiceHint" role="status" hidden></p>

    <div class="foot">
      <span>น้องจ๊างน้อยเป็นผู้ช่วย AI ข้อมูลบางอย่างอาจคลาดเคลื่อน</span>
      <button class="linkish" id="reset" type="button">เริ่มคุยใหม่</button>
    </div>
  </section>
</div>

<!-- รูปมาสคอต ฝังมาในไฟล์นี้แล้ว ไม่ต้องอัปโหลดที่ไหนอีก -->

<script>
(function(){
  'use strict';

  /* ====== ตั้งค่าเพียงบรรทัดเดียว ======
     วางลิงก์ /exec ของเว็บแอป Apps Script ที่เผยแพร่แบบ Anyone ลงตรงนี้ */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwrIU_DckkcNmJtBaS6HqtCtaqobrsCJ95zOfJmw6wcWUQzl8BffoV8oeg_hpI2bdtJFw/exec';
  /* ==================================== */

  var DRIVE_URL = '';
  var ROTATE = new URLSearchParams(location.search).get('rotate') || '';   /* ?rotate=90 หรือ 270 */
  var IDLE_RESET_MS = 90000;                    /* ล้างหน้าจอเมื่อไม่มีคนแตะนานเท่านี้ */
  var GREETING = 'สวัสดีครับ น้องจ๊างน้อยเป็นไกด์เรื่องล้านนา อยากรู้เรื่องอะไร พิมพ์ถามมาได้เลยครับ หรือแตะคำถามด้านล่างก็ได้';
  var STARTERS = [
    'อาหารล้านนามีอะไรบ้าง',
    'ข้าวซอยมาจากไหน',
    'กาแลบนหลังคาบ้านมีไว้ทำไม',
    'ปี๋ใหม่เมืองเล่นอะไรบ้าง',
    'ผ้าซิ่นตีนจกทำยากไหม'
  ];

  if(ROTATE === '90') document.body.classList.add('rot90');
  if(ROTATE === '270') document.body.classList.add('rot270');

  var log = document.getElementById('log');
  var panel = document.getElementById('mascotPanel');
  var q = document.getElementById('q');
  var sendBtn = document.getElementById('send');
  var micBtn = document.getElementById('mic');
  var chips = document.getElementById('chips');
  var mascot = document.getElementById('mascot');
  var MIC_IDLE = 'แตะแล้วพูด';
  var history = [];
  var busy = false;
  var typingEl = null;
  var idleTimer = null;

  mascot.src = (window.MASCOT_SRC && window.MASCOT_SRC.length > 200) ? window.MASCOT_SRC : DRIVE_URL;

  STARTERS.forEach(function(text){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = text;
    b.addEventListener('click', function(){ q.value = text; ask(); });
    chips.appendChild(b);
  });

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function format(text){
    var lines = escapeHtml(text).split(/\n+/);
    var html = '', open = false;
    lines.forEach(function(line){
      line = line.trim();
      if(!line) return;
      line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                 .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
      if(/^[-*•]\s+/.test(line)){
        if(!open){ html += '<ul>'; open = true; }
        html += '<li>' + line.replace(/^[-*•]\s+/, '') + '</li>';
      } else {
        if(open){ html += '</ul>'; open = false; }
        html += '<p>' + line + '</p>';
      }
    });
    if(open) html += '</ul>';
    return html;
  }

  function addMessage(kind, text, withVoice){
    var div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.innerHTML = kind === 'me' ? '<p>' + escapeHtml(text) + '</p>' : format(text);
    if(kind === 'bot' && withVoice !== false && 'speechSynthesis' in window){
      var s = document.createElement('button');
      s.type = 'button';
      s.className = 'speak';
      s.textContent = 'ฟังเสียง';
      s.addEventListener('click', function(){ speak(text, s); });
      div.appendChild(s);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  /* เลือกเสียงภาษาไทยตัวแรกที่เครื่องมี แล้วดันระดับเสียงขึ้นเล็กน้อย
     ให้ฟังเป็นเด็กมากกว่าเสียงผู้ใหญ่ปกติ */
  var voicePick = null;

  function pickVoice(){
    if(voicePick) return voicePick;
    var all = speechSynthesis.getVoices() || [];
    if(!all.length) return null;                       /* รายชื่อยังโหลดไม่เสร็จ ค่อยเลือกใหม่รอบหน้า */
    voicePick = all.filter(function(v){
      return /^th/i.test(v.lang) || /thai|ไทย/i.test(v.name);
    })[0] || null;
    return voicePick;
  }

  function speak(text, btn){
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); btn.textContent = 'ฟังเสียง'; return; }
    var u = new SpeechSynthesisUtterance(text.replace(/\*+/g,''));
    u.lang = 'th-TH';
    u.rate = 0.95;
    var v = pickVoice();
    if(v) u.voice = v;
    u.pitch = 1.15;                                    /* ปรับตัวเลขนี้ถ้าอยากได้เสียงสูงหรือต่ำกว่านี้ */
    u.onend = function(){ btn.textContent = 'ฟังเสียง'; };
    btn.textContent = 'หยุดอ่าน';
    speechSynthesis.speak(u);
  }

  function setBusy(state){
    busy = state;
    sendBtn.disabled = state;
    panel.classList.toggle('thinking', state);
    if(state){
      typingEl = document.createElement('div');
      typingEl.className = 'msg bot';
      typingEl.innerHTML = '<p>น้องจ๊างน้อยกำลังคิด <span class="dots"><i></i><i></i><i></i></span></p>';
      log.appendChild(typingEl);
      log.scrollTop = log.scrollHeight;
    } else if(typingEl){
      typingEl.remove();
      typingEl = null;
    }
  }

  function clearChat(){
    history = [];
    log.innerHTML = '';
    q.value = '';
    if('speechSynthesis' in window) speechSynthesis.cancel();
    addMessage('bot', GREETING, false);
  }

  /* คนถัดไปที่เดินมาควรเจอหน้าจอสะอาด */
  function touchIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){
      if(!busy && history.length) clearChat();
    }, IDLE_RESET_MS);
  }
  ['pointerdown','keydown'].forEach(function(ev){
    document.addEventListener(ev, touchIdle, true);
  });

  /* เรียก Apps Script ด้วยวิธี JSONP คือโหลดผลลัพธ์ผ่านแท็ก script
     วิธีนี้ไม่ติดข้อจำกัด CORS ซึ่งเป็นปัญหาที่พบบ่อยเวลาเรียก Apps Script จากเว็บอื่น */
  function callApi(text, done){
    if(API_URL.indexOf('วางรหัส') > -1 || API_URL.indexOf('/exec') < 0){
      done(null, 'ยังไม่ได้ใส่ลิงก์ API ในไฟล์ index.html ครับ ดูบรรทัด API_URL ด้านบนสุดของไฟล์');
      return;
    }
    var name = 'lannaCb' + Math.random().toString(36).slice(2);
    var tag = document.createElement('script');
    var timer = setTimeout(function(){
      finish(null, 'รอคำตอบนานเกินไปครับ ลองกดถามใหม่อีกครั้ง');
    }, 40000);

    function finish(res, reason){
      clearTimeout(timer);
      try { delete window[name]; } catch(e){ window[name] = undefined; }
      if(tag.parentNode) tag.parentNode.removeChild(tag);
      done(res, reason);
    }

    window[name] = function(res){ finish(res); };
    tag.onerror = function(){
      finish(null, 'เรียก API ไม่สำเร็จครับ ตรวจสามอย่าง ลิงก์ /exec ถูกต้องไหม เผยแพร่แบบ Anyone หรือยัง และ Deploy เป็น New version หลังแก้โค้ดแล้วหรือยัง');
    };

    /* ตัดประวัติให้สั้น เพราะ JSONP ส่งข้อมูลผ่าน URL ซึ่งมีขีดจำกัดความยาว */
    var brief = history.slice(-4).map(function(m){
      return { role: m.role, text: String(m.text).slice(0, 300) };
    });
    tag.src = API_URL + '?q=' + encodeURIComponent(text) +
              '&h=' + encodeURIComponent(JSON.stringify(brief)) +
              '&callback=' + name;
    document.body.appendChild(tag);
  }

  function ask(){
    if(busy) return;
    var text = q.value.trim();
    if(!text){ q.focus(); return; }

    addMessage('me', text);
    q.value = '';
    setBusy(true);
    touchIdle();

    callApi(text, function(res, reason){
      setBusy(false);
      if(res && res.ok){
        addMessage('bot', res.answer);
        history.push({role:'user', text:text}, {role:'model', text:res.answer});
        if(history.length > 6) history = history.slice(-6);
      } else if(res){
        addMessage('err', res.message || 'ตอบไม่สำเร็จ ลองใหม่อีกครั้งครับ');
      } else {
        addMessage('err', reason);
      }
      touchIdle();
    });
  }

  sendBtn.addEventListener('click', ask);
  document.getElementById('reset').addEventListener('click', function(){ clearChat(); q.focus(); });

  q.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
  });

  document.getElementById('full').addEventListener('click', function(){
    var el = document.documentElement;
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(el.requestFullscreen) el.requestFullscreen()['catch'](function(){});
  });

  /* ---------- พูดคำถามแทนการพิมพ์ ---------- */
  var micLabel = document.getElementById('micLabel');
  var voiceHint = document.getElementById('voiceHint');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function hint(msg){
    voiceHint.textContent = msg || '';
    voiceHint.hidden = !msg;
  }

  function micErrorText(code){
    if(code === 'aborted') return '';
    if(code === 'no-speech') return 'ไม่ได้ยินเสียงเลยครับ ลองแตะปุ่มพูดแล้วพูดใกล้ไมโครโฟนอีกครั้ง';
    if(code === 'audio-capture') return 'หาไมโครโฟนไม่เจอครับ ตรวจดูว่าเสียบไมโครโฟนแล้วหรือยัง';
    if(code === 'network') return 'ต้องต่ออินเทอร์เน็ตถึงจะแปลงเสียงเป็นข้อความได้ครับ';
    if(code === 'not-allowed' || code === 'service-not-allowed'){
      return 'เบราว์เซอร์ยังไม่อนุญาตให้ใช้ไมโครโฟนครับ กดรูปกุญแจข้างช่องที่อยู่เว็บแล้วเลือกอนุญาตไมโครโฟน ' +
             'ถ้ายังไม่ได้ ให้คลิกขวาบนหน้าเว็บแล้วเลือกเปิดเฟรมนี้ในแท็บใหม่ แล้วใช้จากแท็บนั้น';
    }
    return 'ใช้ไมโครโฟนไม่ได้ (' + code + ') พิมพ์คำถามแทนได้ครับ';
  }

  if(!SR){
    micBtn.disabled = true;
    micBtn.title = 'เบราว์เซอร์นี้ยังพูดใส่ไม่ได้ ให้ใช้ Chrome หรือ Edge';
  } else {
    var rec = new SR();
    rec.lang = 'th-TH';
    rec.interimResults = true;      /* โชว์ข้อความระหว่างพูด จะได้รู้ว่าเครื่องได้ยินอยู่ */
    rec.continuous = false;
    rec.maxAlternatives = 1;
    var listening = false;
    var finalText = '';

    micBtn.addEventListener('click', function(){
      if(busy) return;
      if(listening){ rec.stop(); return; }
      finalText = '';
      q.value = '';
      hint('');
      try { rec.start(); } catch(e){ hint('เริ่มฟังไม่สำเร็จ ลองแตะปุ่มพูดอีกครั้งครับ'); }
    });

    rec.onstart = function(){
      listening = true;
      micBtn.setAttribute('aria-pressed','true');
      micBtn.classList.add('listening');
      micLabel.textContent = 'หยุด';
      hint('กำลังฟังอยู่ครับ พูดคำถามได้เลย พูดจบแล้วรอสักครู่');
    };

    rec.onresult = function(e){
      var interim = '';
      for(var i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      q.value = (finalText + interim).trim();
    };

    rec.onerror = function(e){ hint(micErrorText(e.error)); };

    rec.onend = function(){
      listening = false;
      micBtn.setAttribute('aria-pressed','false');
      micBtn.classList.remove('listening');
      micLabel.textContent = MIC_IDLE;
      if(finalText.trim()){ hint(''); ask(); }      /* พูดจบแล้วส่งคำถามให้เลย ไม่ต้องกดถามซ้ำ */
    };
  }

  addMessage('bot', GREETING, false);
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = function(){ voicePick = null; pickVoice(); };
  }
  touchIdle();
})();
</script>
